[project]
name = "onolys-evaluation"
version = "0.1.0"
description = "Evaluation engine: clinician rating card in, comparison report out (reasons audit, paudit rating, tips)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "onolys-core",
  "eaudit",
  "onolys-paudit",
  "pydantic>=2.7",
  "jsonschema>=4.22",
]

[tool.uv.sources]
onolys-core = { workspace = true }
eaudit = { workspace = true }
onolys-paudit = { workspace = true }

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-cov>=7.1.0", "ruff>=0.6", "pyyaml>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onolys_evaluation"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-m 'not live'"
markers = [
  "unit: fast, no network or external services",
  "integration: multiple components or local services, no paid/live providers",
  "live: calls real external providers (LLM); excluded by default",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
