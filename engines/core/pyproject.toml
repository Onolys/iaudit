[project]
name = "onolys-core"
version = "0.1.0"
description = "Shared interface types and services for Onolys engines"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.7", "pyyaml>=6", "litellm>=1.50", "rapidfuzz>=3.14.6"]

[project.optional-dependencies]
stt-google = ["google-cloud-speech>=2.26"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-cov>=5", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onolys_core"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-m 'not live'"
markers = [
  "unit: fast, no network or external services",
  "integration: multiple components or local services, no paid/live providers",
  "live: calls real external providers (STT/LLM); excluded by default",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
