# staging model routes (SP01 R3 format); ROUTES_FILE points here in the deployed image.
# Every shipped route is Claude Sonnet; swapping a model is an edit to this file.
# `thinking` is deliberately not set: claude-sonnet-5-5 rejects {type: disabled}.
cheap: &sonnet
  litellm_id: anthropic/claude-sonnet-5-5
  api_key_env: ANTHROPIC_API_KEY
  structured_output_mode: json_object
  caching_mode: anthropic_ephemeral
  supports_temperature: false
  max_output_tokens: 16000
  context_tokens: 1000000
  timeout_s: 180
  max_concurrency: 8
  max_retries: 3
  backoff_s: 2
  extra_params: {}
mid: *sonnet
strong: *sonnet
paudit_code: {alias: mid}
paudit_globals: {alias: mid}
tips: {alias: mid}

# Staging-only forced-failure presets (SP09 D4). Reachable via POST /runs {preset}; never in prod.
# Task routes are redefined as full working routes (not aliases) so they do not follow a broken `mid`.
presets:
  default:
    routes: {}
  test-broken-llm:
    routes:
      cheap: {<<: *sonnet, litellm_id: anthropic/claude-does-not-exist-0}
      mid: {<<: *sonnet, litellm_id: anthropic/claude-does-not-exist-0}
      strong: {<<: *sonnet, litellm_id: anthropic/claude-does-not-exist-0}
      paudit_code: {<<: *sonnet, litellm_id: anthropic/claude-does-not-exist-0}
      paudit_globals: {<<: *sonnet, litellm_id: anthropic/claude-does-not-exist-0}
      tips: {<<: *sonnet, litellm_id: anthropic/claude-does-not-exist-0}
  test-broken-eaudit:
    routes:
      cheap: {<<: *sonnet, litellm_id: anthropic/claude-does-not-exist-0}
      mid: {<<: *sonnet, litellm_id: anthropic/claude-does-not-exist-0}
      strong: {<<: *sonnet, litellm_id: anthropic/claude-does-not-exist-0}
      paudit_code: {<<: *sonnet}
      paudit_globals: {<<: *sonnet}
      tips: {<<: *sonnet}
