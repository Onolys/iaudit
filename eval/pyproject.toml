[project]
name = "iaudit-eval"
version = "0.1.0"
description = "Interview Evidence Auditor evaluation engine"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.156.4",
  "httpx>=0.27",
  "jsonschema>=4.22",
  "referencing>=0.35",
  "uvicorn>=0.54.0",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iaudit_eval"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
