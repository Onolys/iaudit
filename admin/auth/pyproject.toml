[project]
name = "onolys-admin-auth"
version = "0.1.0"
description = "ASGI Identity Platform ID-token + email-allowlist gate for admin services"
requires-python = ">=3.12,<3.13"
dependencies = [
    "google-auth>=2.30",
    "requests>=2.31",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "httpx>=0.27", "starlette>=0.40", "cryptography>=42"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onolys_admin_auth"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["unit: fast, no network or external services"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
