[project]
name = "onolys-admin-backend"
version = "0.1.0"
description = "Admin gateway: auth + CORS in front of the eaudit app (single Cloud Run service)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "onolys-admin-auth",
    "eaudit",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "httpx>=0.27", "cryptography>=42"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onolys_admin_backend"]

[tool.uv.sources]
onolys-admin-auth = { workspace = true }
eaudit = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["unit: fast, no network or external services"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
