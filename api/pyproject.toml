[project]
name = "onolys-api"
version = "0.1.0"
description = "Onolys public /v1 API and job worker (one image, SERVICE_MODE api|worker|combined)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "onolys-core[stt-google]",
    "onolys-evaluation",
    "onolys-paudit",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "google-cloud-firestore>=2.19",
    "google-cloud-storage>=2.18",
    "google-auth>=2.30",
    "requests>=2.31",
    "google-cloud-tasks>=2.16",
    "jsonschema>=4",
]

[tool.uv.sources]
onolys-core = { workspace = true }
onolys-evaluation = { workspace = true }
onolys-paudit = { workspace = true }

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-cov>=5", "ruff>=0.6", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onolys_api"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-m 'not live'"
markers = [
  "unit: fast, no network or external services",
  "integration: multiple components or local services, no paid/live providers",
  "live: calls real external providers (STT/LLM); excluded by default",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
