name: Nightly

# Slower end-to-end checks that do not run on every PR.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eval-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: eaudit
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: eaudit/uv.lock
      - run: uv sync --frozen
      - run: uv run --no-sync python -m eval.run --mode oracle --gate poc
