name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # SP01 Task 2 moves eaudit into the workspace: change only this value
  # (and the matching `paths` in scripts/ci/changes.sh).
  EAUDIT_DIR: eaudit

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      eaudit: ${{ steps.flags.outputs.eaudit }}
      core: ${{ steps.flags.outputs.core }}
      paudit: ${{ steps.flags.outputs.paudit }}
      evaluation: ${{ steps.flags.outputs.evaluation }}
      api: ${{ steps.flags.outputs.api }}
      frontend: ${{ steps.flags.outputs.frontend }}
      web: ${{ steps.flags.outputs.web }}
      infra: ${{ steps.flags.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test changes.sh
        run: bash scripts/ci/test_changes.sh
      - id: flags
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = "push" ]; then
            export FORCE_ALL=true
            files=""
          else
            files="$(git diff --name-only "$BASE_SHA...$HEAD_SHA")"
          fi
          printf '%s\n' "$files" | bash scripts/ci/changes.sh

  eaudit:
    needs: changes
    if: needs.changes.outputs.eaudit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ env.EAUDIT_DIR }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: ${{ env.EAUDIT_DIR }}/uv.lock
      - run: uv sync --frozen
      - run: uv run --no-sync ruff check src tests
      - run: uv run --no-sync pytest -q

  core:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen --package onolys-core
      - run: uv run --no-sync --package onolys-core ruff check engines/core
      - name: pytest with coverage
        run: |
          uv run --no-sync --package onolys-core pytest engines/core -m "not live" \
            --cov=engines/core/src --cov-report=
          {
            echo "### Coverage: onolys-core"
            uv run --no-sync --package onolys-core coverage report --format=markdown
          } >> "$GITHUB_STEP_SUMMARY"

  paudit:
    needs: changes
    if: needs.changes.outputs.paudit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen --package onolys-paudit
      - run: uv run --no-sync --package onolys-paudit ruff check engines/paudit
      - name: pytest with coverage
        run: |
          uv run --no-sync --package onolys-paudit pytest engines/paudit -m "not live" \
            --cov=engines/paudit/src --cov-report=
          {
            echo "### Coverage: onolys-paudit"
            uv run --no-sync --package onolys-paudit coverage report --format=markdown
          } >> "$GITHUB_STEP_SUMMARY"

  evaluation:
    needs: changes
    if: needs.changes.outputs.evaluation == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen --package onolys-evaluation
      - run: uv run --no-sync --package onolys-evaluation ruff check engines/evaluation
      - name: pytest with coverage
        run: |
          uv run --no-sync --package onolys-evaluation pytest engines/evaluation -m "not live" \
            --cov=engines/evaluation/src --cov-report=
          {
            echo "### Coverage: onolys-evaluation"
            uv run --no-sync --package onolys-evaluation coverage report --format=markdown
          } >> "$GITHUB_STEP_SUMMARY"

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: vitest with coverage
        shell: bash   # pipefail: a failing test fails the step despite tee
        run: |
          # needs @vitest/coverage-v8 in web/devDependencies
          npm test -- --coverage --coverage.reporter=text-summary | tee coverage-summary.txt
          {
            echo "### Coverage: web"
            echo '```'
            cat coverage-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - run: npm run build

  infra:
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate
