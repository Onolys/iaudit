name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      eaudit: ${{ steps.flags.outputs.eaudit }}
      core: ${{ steps.flags.outputs.core }}
      paudit: ${{ steps.flags.outputs.paudit }}
      evaluation: ${{ steps.flags.outputs.evaluation }}
      api: ${{ steps.flags.outputs.api }}
      frontend: ${{ steps.flags.outputs.frontend }}
      web: ${{ steps.flags.outputs.web }}
      infra: ${{ steps.flags.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test changes.sh
        run: bash scripts/ci/test_changes.sh
      - id: flags
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = "push" ]; then
            export FORCE_ALL=true
            files=""
          else
            files="$(git diff --name-only "$BASE_SHA...$HEAD_SHA")"
          fi
          printf '%s\n' "$files" | bash scripts/ci/changes.sh

  eaudit:
    needs: changes
    if: needs.changes.outputs.eaudit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: eaudit
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: eaudit/uv.lock
      - run: uv sync --frozen
      - run: uv run --no-sync ruff check src tests
      - run: uv run --no-sync pytest -q

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
