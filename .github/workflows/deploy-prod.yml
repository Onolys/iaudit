name: deploy-prod

# Gated promotion to prod (SP06 R13, D5, D6, AC6, AC9): ships the EXACT image digest that ran in staging. No rebuild.
#   workflow_dispatch (input sha, or input version; both empty = the commit staging api runs now) or push of a tag v*.
#   The prod deploy jobs run in the GitHub environment `production` (required reviewer = Tejit).
#   Release = dispatch with sha empty (or a sha). Every successful deploy is tagged prod-<UTC date>.<n> by the final `tag` job
#   (rollbacks and re-deploys included; only after smoke passes). The newest prod-* tag = last fully successful deploy;
#   to undo a bad release, roll back to the tag before it. After a failed run prod may be mixed (check /v1/healthz code_version
#   or the revisions' GIT_SHA).
#   Rollback = dispatch with version=<prod-* tag> (or an earlier sha that was deployed to staging): api, worker, rules, web all
#   go back to that commit. List versions: git ls-remote --tags --refs --sort=-v:refname origin 'prod-*' | head
#   Set sha OR version, not both. `v*` = optional human release trigger; `prod-*` = bot record of each successful deploy;
#   roll back only by `prod-*` version or `sha`.
#   The prod-* tags cannot re-trigger this workflow: they do not match `v*`, and tags pushed with GITHUB_TOKEN never trigger workflows.
# Repo variables (owner sets from Terraform outputs; see docs/reference/infra.md):
#   WIF_PROVIDER, DEPLOYER_STAGING_SA (read-only resolve step), DEPLOYER_PROD_SA, GCP_PROJECT (optional), GCP_REGION (optional),
#   PROD_VITE_FIREBASE_{API_KEY,AUTH_DOMAIN,APP_ID,STORAGE_BUCKET,MESSAGING_SENDER_ID} (Terraform output web_env_prod),
#   PROD_VITE_CONTACT_EMAIL (optional)
# Approval: the prod jobs (api, worker, rules, web) all start right after `resolve`, so GitHub shows ONE
# "Review pending deployments" prompt for `production` and one click releases them all (a later-starting gated job
# would need a second approval). Trade-off: no ordering between api and web; the Hosting rewrite targets the service
# by name, so that is safe. `resolve` uses the staging deployer, which can only read, before approval.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full 40-char commit sha to promote or roll back to (empty = the commit the staging api runs now)
        type: string
        required: false
        default: ""
      version:
        description: Prod version tag to promote or roll back to, e.g. prod-2026-11-21.1 (set this OR sha, not both)
        type: string
        required: false
        default: ""
  push:
    tags:
      - 'v*'

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read

env:
  PROJECT: ${{ vars.GCP_PROJECT || 'onolys' }}
  REGION: ${{ vars.GCP_REGION || 'us-central1' }}
  FIREBASE_TOOLS_VERSION: 15.37.0

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
      image: ${{ steps.digest.outputs.image }}
    steps:
      # Checkout comes BEFORE auth: checkout cleans the workspace and would delete the gha-creds-*.json that auth writes
      # there. The default-ref checkout is only a git repo to move to the resolved sha later (no checkout after auth).
      - uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_STAGING_SA }}
          token_format: access_token
      - name: Pick the commit (input sha, else prod version tag, else pushed tag commit, else what staging api runs now)
        id: sha
        env:
          INPUT_SHA: ${{ inputs.sha }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_TYPE: ${{ github.ref_type }}
          TAG_SHA: ${{ github.sha }}
        run: |
          if [ -n "$INPUT_SHA" ] && [ -n "$INPUT_VERSION" ]; then
            echo "set either sha or version, not both" >&2; exit 1
          fi
          sha="$INPUT_SHA"
          if [ -n "$INPUT_VERSION" ]; then
            version_re='^prod-[0-9]{4}-[0-9]{2}-[0-9]{2}\.[0-9]+$'
            [[ "$INPUT_VERSION" =~ $version_re ]] || { echo "version must look like prod-YYYY-MM-DD.N, got '$INPUT_VERSION'" >&2; exit 1; }
            git fetch --no-tags origin "refs/tags/${INPUT_VERSION}:refs/tags/${INPUT_VERSION}" \
              || { echo "no tag ${INPUT_VERSION} on origin" >&2; exit 1; }
            sha="$(git rev-parse "refs/tags/${INPUT_VERSION}^{commit}")" \
              || { echo "tag ${INPUT_VERSION} does not point at a commit" >&2; exit 1; }
          fi
          [ -n "$sha" ] || { [ "$REF_TYPE" = tag ] && sha="$TAG_SHA"; } || true
          if [ -z "$sha" ]; then
            sha="$(gcloud run services describe onolys-api-staging --region "$REGION" --project "$PROJECT" --format=json \
              | jq -r '.spec.template.spec.containers[0].env[] | select(.name=="GIT_SHA") | .value')"
          fi
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "sha must be a full 40-char lowercase hex commit sha, got '$sha'" >&2; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          {
            echo "### Promoting to prod"
            echo "- commit: \`${sha}\`"
            [ -z "$INPUT_VERSION" ] || echo "- version: \`${INPUT_VERSION}\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Move the workspace to the resolved commit (plain git, keeps the creds file)
        env:
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          # Keep the matcher from the workflow's own ref: older shas (rollbacks) do not have it in their tree.
          cp scripts/ci/staging_ran_image.py "$RUNNER_TEMP/staging_ran_image.py"
          git fetch --no-tags --depth=1 origin "$SHA"
          git checkout --detach "$SHA"
      - name: Config guard (source tree at this commit)
        run: bash scripts/ci/check_config.sh
      - name: Resolve the sha tag to a digest and require that staging ran exactly that image at that commit
        id: digest
        env:
          SHA: ${{ steps.sha.outputs.sha }}
          TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          repo="${REGION}-docker.pkg.dev/${PROJECT}/onolys/api"
          digest="$(gcloud artifacts docker images describe "${repo}:${SHA}" --format='value(image_summary.digest)')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "no image tagged ${SHA} in ${repo} (was it built by deploy-staging?)" >&2; exit 1; }
          image="${repo}@${digest}"
          # The tag digest is an OCI index; Cloud Run records the resolved platform manifest digest in its revisions.
          # So fetch the index and accept either the index digest or any platform digest it lists (plus GIT_SHA == sha).
          curl -fsS -o "$RUNNER_TEMP/index.json" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
            "https://${REGION}-docker.pkg.dev/v2/${PROJECT}/onolys/api/manifests/${digest}"
          for svc in onolys-api-staging onolys-worker-staging; do
            gcloud run revisions list --service "$svc" --region "$REGION" --project "$PROJECT" --format=json > "$RUNNER_TEMP/revisions.json"
            python3 "$RUNNER_TEMP/staging_ran_image.py" --sha "$SHA" --digest "$digest" --index "$RUNNER_TEMP/index.json" --revisions "$RUNNER_TEMP/revisions.json" >/dev/null \
              || { echo "digest ${digest} (commit ${SHA}) never ran on ${svc} with GIT_SHA=${SHA}; deploy it to staging first" >&2; exit 1; }
          done
          rm -f "$RUNNER_TEMP/index.json" "$RUNNER_TEMP/revisions.json"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "promoting ${image} (commit ${SHA})"
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
      - name: Config guard (inside the image, by digest)
        env:
          IMAGE: ${{ steps.digest.outputs.image }}
        run: bash scripts/ci/check_config.sh --image "$IMAGE"

  deploy-api:
    needs: resolve
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/_deploy-cloudrun.yml
    with:
      env: prod
      service: onolys-api-prod
      image: ${{ needs.resolve.outputs.image }}
      region: us-central1
      git_sha: ${{ needs.resolve.outputs.sha }}
    secrets: inherit

  deploy-worker:
    needs: resolve
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/_deploy-cloudrun.yml
    with:
      env: prod
      service: onolys-worker-prod
      image: ${{ needs.resolve.outputs.image }}
      region: us-central1
      git_sha: ${{ needs.resolve.outputs.sha }}
    secrets: inherit

  rules:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_PROD_SA }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy Firestore rules and indexes to the (default) database only
        run: npx --yes firebase-tools@${{ env.FIREBASE_TOOLS_VERSION }} deploy --only 'firestore:(default)' --project "$PROJECT" --non-interactive

  web:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build web (prod)
        working-directory: web
        env:
          VITE_API_BASE_URL: /v1
          VITE_FIREBASE_PROJECT_ID: ${{ env.PROJECT }}
          VITE_FIREBASE_API_KEY: ${{ vars.PROD_VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.PROD_VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_APP_ID: ${{ vars.PROD_VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.PROD_VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.PROD_VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_CONTACT_EMAIL: ${{ vars.PROD_VITE_CONTACT_EMAIL }}
          VITE_FIRESTORE_DATABASE: "(default)"
        run: |
          for v in VITE_FIREBASE_API_KEY VITE_FIREBASE_AUTH_DOMAIN VITE_FIREBASE_APP_ID; do
            [ -n "${!v}" ] || { echo "missing repo variable PROD_${v}" >&2; exit 1; }
          done
          npm ci
          npm run build
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_PROD_SA }}
      - name: Deploy to Hosting target app (site onolys-app, app.onolys.com, /v1/** rewrite to onolys-api-prod)
        run: npx --yes firebase-tools@${{ env.FIREBASE_TOOLS_VERSION }} deploy --config web/firebase.json --only hosting:app --project "$PROJECT" --non-interactive

  smoke:
    needs: [resolve, deploy-api, deploy-worker, rules, web]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: GET https://app.onolys.com/v1/healthz returns 200 with the promoted commit
        env:
          SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          url="https://app.onolys.com/v1/healthz"
          body=""
          for i in $(seq 1 10); do
            if body="$(curl -sf --max-time 20 "$url")"; then break; fi
            echo "attempt $i failed; retrying"; sleep 6; body=""
          done
          [ -n "$body" ] || { echo "healthz did not return 200 at $url" >&2; exit 1; }
          echo "$body"
          echo "$body" | jq -e --arg sha "$SHA" '.code_version == $sha'

  # Runs only when every prod deploy job AND the healthz smoke succeeded (default success() over `needs`). Tags the promoted commit
  # prod-<UTC date>.<n>, always a NEW tag (also for a rollback / re-deploy of an already-tagged sha), so the newest
  # prod-* tag = the last fully successful deploy (rollback target). The only job that may write to the repo. The checkout is
  # only a git repo to push from; the target commit is fetched just to tag it.
  tag:
    needs: [resolve, deploy-api, deploy-worker, rules, web, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create and push the annotated prod-<date>.<n> tag
        env:
          SHA: ${{ needs.resolve.outputs.sha }}
          IMAGE: ${{ needs.resolve.outputs.image }}
        shell: bash
        run: |
          set -o pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags --depth=1 origin "$SHA"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          pushed=""
          for attempt in 1 2 3 4 5; do
            # ls-remote is authoritative; recomputed each attempt so a race (tag already taken) picks the next N.
            d="$(date -u +%F)"
            n="$(git ls-remote --tags --refs origin "prod-$d.*" | sed -nE "s#.*/prod-$d\.([0-9]+)\$#\1#p" | sort -n | tail -1)"
            tag="prod-$d.$((10#${n:-0}+1))"
            git tag -a "$tag" "$SHA" -m "prod deploy ${tag}" -m "commit: ${SHA}" -m "image: ${IMAGE}" -m "run: ${run_url}"
            if git push origin "refs/tags/${tag}"; then pushed=1; break; fi
            echo "push of ${tag} failed (attempt ${attempt}); recomputing" >&2
            git tag -d "$tag"
            sleep 2
          done
          [ -n "$pushed" ] || { echo "could not push a prod tag after 5 attempts" >&2; exit 1; }
          echo "tagged ${SHA} as ${tag}"
          {
            echo "### Prod version \`${tag}\`"
            echo "- commit: \`${SHA}\`"
            echo "- image: \`${IMAGE}\`"
            echo "- rollback: dispatch deploy-prod with version=\`${tag}\`"
          } >> "$GITHUB_STEP_SUMMARY"
